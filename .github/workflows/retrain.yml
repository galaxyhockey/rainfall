# Monthly: retrain on the latest observations and commit models.pkl.
# The commit also keeps the repo "active" -- GitHub pauses scheduled workflows after 60 days without one.
name: Retrain model
on:
  schedule:
    - cron: "30 9 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python train.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add models.pkl
          git commit -m "Monthly retrain" && git push || echo "no change"
